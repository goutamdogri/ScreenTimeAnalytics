packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  electron: true
  electron-winstaller: false
  prisma: true
  unrs-resolver: true
  usocket: true

# Windows-only installers (electron-winstaller via electron-builder) carry build
# scripts we never need; treat their ignored builds as a warning, not an error.
strictDepBuilds: false

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.5'
  - '@nestjs/core@11.2.5'
  - '@nestjs/platform-express@11.2.5'
  - '@nestjs/testing@11.2.5'
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/linux-static-x64@2.10.13'
  - '@turbo/linux-static-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
  - electron@44.4.1
