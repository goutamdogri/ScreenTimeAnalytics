version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screen
      POSTGRES_PASSWORD: screen
      POSTGRES_DB: screen_time
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U screen -d screen_time']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://screen:screen@db:5432/screen_time?schema=public
      JWT_ACCESS_SECRET: change-me-in-production-access
      JWT_REFRESH_SECRET: change-me-in-production-refresh
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      PORT: '3000'
      NODE_ENV: development
      ENCRYPTION_MASTER_KEY: change-me-32-byte-base64-master-key
      LLM_OLLAMA_URL: http://host.docker.internal:11434
      CLASSIFICATION_POLL_MS: '30000'
      CLASSIFICATION_BATCH_SIZE: '50'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: